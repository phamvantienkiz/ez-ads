<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EZ-Ads Manager · Data Architecture &amp; Schema (ERD)</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #F8F9FB;
      --color-ink: #111114;
      --color-muted: #515465;
      --color-accent: #EB6C36;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', Georgia, serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem;
    }

    .frame {
      max-width: 1320px;
      width: 100%;
      background: #FFFFFF;
      border: 1px solid #E2E4E9;
      border-radius: 20px;
      padding: 1.5rem;
      box-shadow: 0 4px 24px rgba(17, 17, 20, 0.04);
    }

    .diagram-container {
      width: 100%;
      overflow-x: auto;
      border-radius: 12px;
    }

    .diagram-container img, .diagram-container svg {
      width: 100%;
      min-width: 960px;
      height: auto;
      display: block;
      aspect-ratio: 16 / 9;
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="diagram-container">
      <img src="./data-architecture-erd.svg" alt="EZ-Ads Manager - Data Architecture &amp; Physical Schema Specification" />
    </div>
  </div>
</body>
</html>
